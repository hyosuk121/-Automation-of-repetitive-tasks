name: Inspect public aviation source pages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aviation-source-probe.yml
      - scripts/aviation-source-probe.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/aviation-source-probe.js
      - name: Save bounded public page metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c aviation-source-probe-20261123
          git add docs/aviation-source-probe.json
          git commit -m "Record official aviation source page metadata [skip ci]"
          git push origin HEAD:refs/heads/aviation-source-probe-20261123
